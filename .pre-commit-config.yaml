repos:
  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]
        exclude: ^(docs/research-visuals/|\.claude/)

  # YAML validation
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--config-data, "{extends: default, rules: {line-length: disable, indentation: {spaces: 2}}}"]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-json
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # .NET/C# specific
  - repo: https://github.com/dotnet/format
    rev: v5.1.250801
    hooks:
      - id: dotnet-format
        language: system
        types: [csharp]
        entry: dotnet format --verify-no-changes

  # Spelling check (optional, commented out by default)
